apiVersion: v1
kind: Service
metadata:
  name: raft-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: raft
  ports:
    - { name: raft, port: 9001 }
    - { name: http, port: 8080 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: node
spec:
  serviceName: raft-headless
  podManagementPolicy: Parallel
  replicas: 5
  selector:
    matchLabels:
      app: raft
  template:
    metadata:
      labels:
        app: raft
    spec:
      terminationGracePeriodSeconds: 15
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: raft
      containers:
        - name: node
          image: raft-e2e:latest
          imagePullPolicy: Never
          args: ["node"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - { name: RAFT_PREVOTE, value: "{{PREVOTE}}" }
            - { name: RAFT_LEASE, value: "{{LEASE}}" }
          ports:
            - containerPort: 9001
            - containerPort: 8080
          volumeMounts:
            - { name: data, mountPath: /data }
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            periodSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 1
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: e2e-client
spec:
  restartPolicy: Never
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - operator: Exists
  containers:
    - name: client
      image: raft-e2e:latest
      imagePullPolicy: Never
      args: ["client"]
